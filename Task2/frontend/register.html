<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - ConnectHub</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


    <div class="auth-container">


        <div class="auth-card">


            <div class="brand-icon">
                ✦
            </div>


            <h1>
                ConnectHub
            </h1>


            <p class="tagline">
                Your world. Your people. Your stories.
            </p>


            <p class="subtitle">
                Create your profile and start connecting with others.
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>


            </form>


            <p id="message"></p>


            <div class="features">

                <div>
                    <span>✨</span>
                    <p>Create</p>
                </div>

                <div>
                    <span>📸</span>
                    <p>Share</p>
                </div>

                <div>
                    <span>❤️</span>
                    <p>Connect</p>
                </div>

            </div>


            <p class="switch-page">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
