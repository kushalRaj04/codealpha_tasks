<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ConnectHub</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


    <div class="auth-container">


        <div class="auth-card">


            <div class="brand-icon">
                ✦
            </div>


            <h1>
                ConnectHub
            </h1>


            <p class="tagline">
                Connect. Share. Discover.
            </p>


            <p class="subtitle">
                Welcome back! 👋<br>
                Sign in and stay connected with your community.
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>


            </form>


            <p id="message"></p>


            <div class="features">

                <div>
                    <span>👥</span>
                    <p>Connect</p>
                </div>

                <div>
                    <span>📸</span>
                    <p>Share</p>
                </div>

                <div>
                    <span>💬</span>
                    <p>Engage</p>
                </div>

            </div>


            <p class="switch-page">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </p>


        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
