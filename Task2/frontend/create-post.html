<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Post - ConnectHub</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="navbar-inner">


            <a href="index.html" class="brand">

                <div class="brand-icon">
                    C
                </div>

                <div class="brand-text">
                    Connect<span>Hub</span>
                </div>

            </a>


            <div class="nav-links">

                <a
                    href="index.html"
                    class="nav-item"
                >
                    <span class="nav-icon">⌂</span>
                    <span>Home</span>
                </a>


                <a
                    href="create-post.html"
                    class="nav-item active"
                >
                    <span class="nav-icon">＋</span>
                    <span>Create</span>
                </a>


                <a
                    href="profile.html"
                    class="nav-item"
                >
                    <span class="nav-icon">◯</span>
                    <span>Profile</span>
                </a>


                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- =========================
         CREATE POST
    ========================== -->

    <main class="create-container">


        <section class="create-post-card">


            <div class="create-post-header">

                <div class="create-icon">
                    ✦
                </div>

                <div>

                    <h1>
                        Create a Post
                    </h1>

                    <p>
                        Share something with your ConnectHub community.
                    </p>

                </div>

            </div>


            <form id="createPostForm">


                <div class="form-group">

                    <label for="content">
                        What's on your mind?
                    </label>

                    <textarea
                        id="content"
                        placeholder="Share your thoughts, ideas or experiences..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="image">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="image"
                        placeholder="https://example.com/image.jpg"
                    >

                    <small>
                        Add an image to make your post more engaging.
                    </small>

                </div>


                <button
                    type="submit"
                    class="create-post-submit"
                >
                    Publish Post
                </button>


            </form>


            <p id="message"></p>


        </section>


    </main>


    <script src="js/api.js"></script>
    <script src="js/create-post.js"></script>

</body>

</html>
